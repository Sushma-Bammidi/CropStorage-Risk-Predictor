services:
  - type: web
    name: crop-storage-api
    env: python
    buildCommand: pip install -r requirements.txt && python ml/generate_dataset.py && python ml/train_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
